<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-labelledby="t d">
<title id="t">Kepler's third law on logarithmic axes</title>
<desc id="d">Orbital period against distance from the Sun for the eight planets, both on log scales; the points fall on a straight line of slope 3/2.</desc>
<rect x="0" y="0" width="800" height="580" fill="#ffffff"/>
<rect x="150" y="70" width="620" height="410" fill="#f3f4f6"/>
<line x1="262.7" y1="70" x2="262.7" y2="480" stroke="#e5e7eb" stroke-width="2"/>
<line x1="262.7" y1="480" x2="262.7" y2="488" stroke="#1f2937" stroke-width="2"/>
<text x="262.7" y="512" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">100</text>
<line x1="544.5" y1="70" x2="544.5" y2="480" stroke="#e5e7eb" stroke-width="2"/>
<line x1="544.5" y1="480" x2="544.5" y2="488" stroke="#1f2937" stroke-width="2"/>
<text x="544.5" y="512" text-anchor="middle" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">1000</text>
<line x1="150" y1="454.4" x2="770" y2="454.4" stroke="#e5e7eb" stroke-width="2"/>
<line x1="142" y1="454.4" x2="150" y2="454.4" stroke="#1f2937" stroke-width="2"/>
<text x="136" y="461.4" text-anchor="end" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">100</text>
<line x1="150" y1="326.2" x2="770" y2="326.2" stroke="#e5e7eb" stroke-width="2"/>
<line x1="142" y1="326.2" x2="150" y2="326.2" stroke="#1f2937" stroke-width="2"/>
<text x="136" y="333.2" text-anchor="end" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">1000</text>
<line x1="150" y1="198.1" x2="770" y2="198.1" stroke="#e5e7eb" stroke-width="2"/>
<line x1="142" y1="198.1" x2="150" y2="198.1" stroke="#1f2937" stroke-width="2"/>
<text x="136" y="205.1" text-anchor="end" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">10,000</text>
<line x1="142" y1="70.0" x2="150" y2="70.0" stroke="#1f2937" stroke-width="2"/>
<text x="136" y="77.0" text-anchor="end" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">100,000</text>
<polyline points="150,70 150,480 770,480" fill="none" stroke="#1f2937" stroke-width="2.5"/>
<text x="460.0" y="550" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">distance from the Sun, million km (log scale)</text>
<text transform="translate(26 275.0) rotate(-90)" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">orbital period, days (log scale)</text>
<line x1="168.7" y1="480.0" x2="770.0" y2="70.0" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 7"/>
<text x="470" y="250" text-anchor="end" font-size="24" font-weight="bold" fill="#b91c1c" font-family="Montserrat, Helvetica, Arial, sans-serif">slope 3/2</text>
<circle cx="195.9" cy="461.5" r="7" fill="#1f2937"/>
<text x="211.9" y="473.5" text-anchor="start" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Mercury</text>
<circle cx="272.4" cy="409.3" r="7" fill="#1f2937"/>
<text x="284.4" y="435.3" text-anchor="start" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Venus</text>
<circle cx="312.0" cy="382.3" r="7" fill="#1f2937"/>
<text x="324.0" y="408.3" text-anchor="start" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Earth</text>
<circle cx="363.6" cy="347.1" r="7" fill="#1f2937"/>
<text x="375.6" y="373.1" text-anchor="start" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Mars</text>
<circle cx="513.9" cy="244.7" r="7" fill="#1f2937"/>
<text x="525.9" y="270.7" text-anchor="start" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Jupiter</text>
<circle cx="588.5" cy="194.1" r="7" fill="#1f2937"/>
<text x="600.5" y="220.1" text-anchor="start" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Saturn</text>
<circle cx="673.5" cy="135.7" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="685.5" y="161.7" text-anchor="start" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Uranus</text>
<circle cx="729.0" cy="98.2" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="715.0" y="90.2" text-anchor="end" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Neptune</text>
<rect x="166" y="84" width="300" height="76" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="186" cy="108" r="7" fill="#1f2937"/>
<text x="204" y="115" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">known to Kepler</text>
<circle cx="186" cy="138" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
<text x="204" y="145" font-size="20" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">found later: a test</text>
</svg>
