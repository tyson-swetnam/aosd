<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Montserrat, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Four-block harmonic stack over a table edge: offsets 1/2, 1/4, 1/6, 1/8 of a block-length, total overhang 25/24</title>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Scale: one block-length L = 300 units; block height 40. Table edge at x = 320. -->
  <text x="20" y="40" font-size="20" fill="#1f2937">Each partial stack balances exactly on the edge beneath it.</text>

  <!-- Table -->
  <rect x="20" y="330" width="300" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <text x="40" y="385" font-size="20" fill="#1f2937">table</text>

  <!-- Blocks, bottom (4) to top (1). Right edges: 357.5, 407.5, 482.5, 632.5 -->
  <rect x="57.5" y="290" width="300" height="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="107.5" y="250" width="300" height="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="182.5" y="210" width="300" height="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="332.5" y="170" width="300" height="40" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
  <g font-size="20" fill="#1f2937">
    <text x="72" y="317">4</text>
    <text x="122" y="277">3</text>
    <text x="197" y="237">2</text>
    <text x="347" y="197">1</text>
  </g>

  <!-- Offset dimensions, each just below the overhanging part of the upper block -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- 1/2: block 1 beyond block 2 -->
    <line x1="482.5" y1="224" x2="632.5" y2="224"/>
    <line x1="482.5" y1="216" x2="482.5" y2="232"/>
    <line x1="632.5" y1="216" x2="632.5" y2="232"/>
    <!-- 1/4: block 2 beyond block 3 -->
    <line x1="407.5" y1="264" x2="482.5" y2="264"/>
    <line x1="407.5" y1="256" x2="407.5" y2="272"/>
    <line x1="482.5" y1="256" x2="482.5" y2="272"/>
    <!-- 1/6: block 3 beyond block 4 -->
    <line x1="357.5" y1="304" x2="407.5" y2="304"/>
    <line x1="357.5" y1="296" x2="357.5" y2="312"/>
    <line x1="407.5" y1="296" x2="407.5" y2="312"/>
    <!-- 1/8: block 4 beyond the table edge -->
    <line x1="320" y1="344" x2="357.5" y2="344"/>
    <line x1="320" y1="336" x2="320" y2="352"/>
    <line x1="357.5" y1="336" x2="357.5" y2="352"/>
  </g>
  <g font-size="20" fill="#1f2937" text-anchor="middle">
    <text x="557.5" y="252">1/2</text>
    <text x="445" y="292">1/4</text>
    <text x="382.5" y="330">1/6</text>
    <text x="340" y="373">1/8</text>
  </g>

  <!-- Centre of mass of the top block: midpoint x = 482.5, above block 2's right edge -->
  <line x1="482.5" y1="190" x2="482.5" y2="210" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="482.5" cy="190" r="6" fill="#b91c1c"/>
  <text x="482.5" y="155" font-size="20" fill="#1f2937" text-anchor="middle">c.m. of top block</text>

  <!-- Combined centre of mass of all four: x = (632.5+482.5+407.5+357.5 - 4*150)/4 = 320, y = 250 -->
  <line x1="320" y1="250" x2="320" y2="330" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="290" y1="166" x2="316" y2="243" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="320" cy="250" r="7" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="300" y="155" font-size="20" fill="#1f2937" text-anchor="end">c.m. of all four</text>

  <!-- Total overhang -->
  <g stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="320" y1="410" x2="320" y2="440"/>
    <line x1="632.5" y1="232" x2="632.5" y2="440"/>
  </g>
  <g stroke="#b91c1c" stroke-width="3">
    <line x1="320" y1="430" x2="632.5" y2="430"/>
    <line x1="320" y1="420" x2="320" y2="440"/>
    <line x1="632.5" y1="420" x2="632.5" y2="440"/>
  </g>
  <text x="476" y="462" font-size="20" fill="#b91c1c" text-anchor="middle">total overhang = 1/2 + 1/4 + 1/6 + 1/8</text>
  <text x="476" y="488" font-size="20" fill="#b91c1c" text-anchor="middle">= 25/24 block-lengths</text>
</svg>
