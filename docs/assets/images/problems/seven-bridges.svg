<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Schematic map of Koenigsberg and the same layout drawn as a graph">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <g font-family="Montserrat, Helvetica, Arial, sans-serif">

    <!-- ===== LEFT PANEL: the map ===== -->
    <rect x="20" y="25" width="490" height="400" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>

    <!-- the river Pregel: trunk to the west, forking east around the land D -->
    <path d="M 20,170 L 340,170 L 510,25 L 510,95 L 360,195 L 360,255 L 510,355 L 510,425 L 340,280 L 20,280 Z"
          fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>

    <!-- the island (Kneiphof) -->
    <ellipse cx="175" cy="225" rx="90" ry="33" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>

    <!-- the seven bridges -->
    <g stroke="#1f2937" stroke-width="11">
      <line x1="120" y1="164" x2="120" y2="200"/>
      <line x1="228" y1="164" x2="228" y2="200"/>
      <line x1="120" y1="250" x2="120" y2="286"/>
      <line x1="228" y1="250" x2="228" y2="286"/>
      <line x1="262" y1="225" x2="368" y2="225" stroke-width="13"/>
      <line x1="434" y1="74" x2="456" y2="152"/>
      <line x1="434" y1="376" x2="456" y2="298"/>
    </g>

    <!-- bridge names -->
    <g fill="#b91c1c" font-size="22" font-style="italic" text-anchor="middle">
      <text x="100" y="152">a</text>
      <text x="250" y="152">b</text>
      <text x="100" y="310">c</text>
      <text x="250" y="310">d</text>
      <text x="315" y="208">e</text>
      <text x="402" y="142">f</text>
      <text x="402" y="312">g</text>
    </g>

    <!-- land names -->
    <g fill="#1f2937" font-size="30" font-weight="bold" text-anchor="middle">
      <text x="175" y="236">A</text>
      <text x="110" y="100">B</text>
      <text x="110" y="365">C</text>
      <text x="443" y="234">D</text>
    </g>

    <!-- ===== RIGHT PANEL: the graph ===== -->
    <g transform="translate(-26,0)" stroke="#1f2937" stroke-width="3" fill="none">
      <path d="M 600,225 Q 665,183 690,110"/>
      <path d="M 600,225 Q 625,151 690,110"/>
      <path d="M 600,225 Q 665,267 690,340"/>
      <path d="M 600,225 Q 625,299 690,340"/>
      <line x1="600" y1="225" x2="760" y2="225"/>
      <line x1="690" y1="110" x2="760" y2="225"/>
      <line x1="690" y1="340" x2="760" y2="225"/>
    </g>
    <g transform="translate(-26,0)" fill="#1f2937">
      <circle cx="600" cy="225" r="10"/>
      <circle cx="690" cy="110" r="10"/>
      <circle cx="690" cy="340" r="10"/>
      <circle cx="760" cy="225" r="10"/>
    </g>

    <g transform="translate(-26,0)" fill="#1f2937" font-size="26" font-weight="bold">
      <text x="582" y="220" text-anchor="end">A</text>
      <text x="690" y="80" text-anchor="middle">B</text>
      <text x="690" y="382" text-anchor="middle">C</text>
      <text x="760" y="272" text-anchor="middle">D</text>
    </g>
    <g transform="translate(-26,0)" fill="#b91c1c" font-size="20">
      <text x="582" y="248" text-anchor="end">5 odd</text>
      <text x="690" y="54" text-anchor="middle">3 odd</text>
      <text x="690" y="408" text-anchor="middle">3 odd</text>
      <text x="760" y="298" text-anchor="middle">3 odd</text>
    </g>

    <!-- panel captions -->
    <g fill="#1f2937" font-size="20" text-anchor="middle">
      <text x="265" y="462">Four lands, seven bridges</text>
      <text x="642" y="462">Only the connections matter</text>
    </g>
  </g>
</svg>
