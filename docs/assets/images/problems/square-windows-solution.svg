<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Before and after: the square window with half the glass</title>
  <desc id="desc">Left: a square window 3 feet high and 3 feet wide. Right: the same opening with a square turned 45 degrees inside it, its corners at the midpoints of the old sides; the four corner triangles are bricked up, leaving half the glass, and the height and width are still 3 feet.</desc>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6b7280" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <!-- titles -->
  <text x="190" y="52" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f2937" text-anchor="middle">Before</text>
  <text x="600" y="52" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f2937" text-anchor="middle">After</text>

  <!-- LEFT PANEL: square 260 x 260 at (60,110) -->
  <rect x="60" y="110" width="260" height="260" fill="#fff3b0" stroke="#1f2937" stroke-width="3"/>
  <line x1="60" y1="84" x2="320" y2="84" stroke="#b91c1c" stroke-width="2"/>
  <line x1="60" y1="76" x2="60" y2="92" stroke="#b91c1c" stroke-width="2"/>
  <line x1="320" y1="76" x2="320" y2="92" stroke="#b91c1c" stroke-width="2"/>
  <rect x="163" y="70" width="54" height="26" fill="#ffffff"/>
  <text x="190" y="90" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle">3 ft</text>
  <line x1="36" y1="110" x2="36" y2="370" stroke="#b91c1c" stroke-width="2"/>
  <line x1="28" y1="110" x2="44" y2="110" stroke="#b91c1c" stroke-width="2"/>
  <line x1="28" y1="370" x2="44" y2="370" stroke="#b91c1c" stroke-width="2"/>
  <rect x="22" y="214" width="28" height="52" fill="#ffffff"/>
  <text x="36" y="247" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle" transform="rotate(-90 36 247)">3 ft</text>
  <text x="190" y="410" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" text-anchor="middle">Glass: 9 sq ft</text>

  <!-- RIGHT PANEL: square 260 x 260 at (470,110); midpoints (600,110) (730,240) (600,370) (470,240) -->
  <!-- corner triangles, bricked up -->
  <polygon points="470,110 600,110 470,240" fill="#9ca3af" stroke="none"/>
  <polygon points="600,110 730,110 730,240" fill="#9ca3af" stroke="none"/>
  <polygon points="730,240 730,370 600,370" fill="#9ca3af" stroke="none"/>
  <polygon points="470,240 600,370 470,370" fill="#9ca3af" stroke="none"/>
  <polygon points="470,110 600,110 470,240" fill="url(#hatch)" stroke="none"/>
  <polygon points="600,110 730,110 730,240" fill="url(#hatch)" stroke="none"/>
  <polygon points="730,240 730,370 600,370" fill="url(#hatch)" stroke="none"/>
  <polygon points="470,240 600,370 470,370" fill="url(#hatch)" stroke="none"/>
  <!-- new rotated window -->
  <polygon points="600,110 730,240 600,370 470,240" fill="#fff3b0" stroke="#1f2937" stroke-width="3"/>
  <!-- old outline, dashed -->
  <rect x="470" y="110" width="260" height="260" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- dimension lines -->
  <line x1="470" y1="84" x2="730" y2="84" stroke="#b91c1c" stroke-width="2"/>
  <line x1="470" y1="76" x2="470" y2="92" stroke="#b91c1c" stroke-width="2"/>
  <line x1="730" y1="76" x2="730" y2="92" stroke="#b91c1c" stroke-width="2"/>
  <rect x="573" y="70" width="54" height="26" fill="#ffffff"/>
  <text x="600" y="90" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle">3 ft</text>
  <line x1="446" y1="110" x2="446" y2="370" stroke="#b91c1c" stroke-width="2"/>
  <line x1="438" y1="110" x2="454" y2="110" stroke="#b91c1c" stroke-width="2"/>
  <line x1="438" y1="370" x2="454" y2="370" stroke="#b91c1c" stroke-width="2"/>
  <rect x="432" y="214" width="28" height="52" fill="#ffffff"/>
  <text x="446" y="247" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle" transform="rotate(-90 446 247)">3 ft</text>
  <text x="600" y="410" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" text-anchor="middle">Glass: 4.5 sq ft</text>
  <text x="600" y="440" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" text-anchor="middle">Blocked corners = 4 x 1/8 = 1/2 of the glass</text>
  <text x="400" y="482" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" text-anchor="middle">Still square, still 3 ft from top to bottom and from side to side.</text>
</svg>
