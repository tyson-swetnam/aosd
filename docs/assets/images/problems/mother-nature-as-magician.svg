<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- ===== Panel A: the string against the sky ===== -->
  <text x="30" y="46" font-size="24" fill="#1f2937">A. The string against the sky</text>
  <rect x="30" y="80" width="390" height="280" fill="#f3f4f6"/>
  <!-- horizon -->
  <line x1="30" y1="360" x2="420" y2="360" stroke="#1f2937" stroke-width="3"/>
  <text x="420" y="390" font-size="20" fill="#1f2937" text-anchor="end">horizon</text>
  <!-- the straight string (dotted chord) -->
  <line x1="60" y1="240" x2="390" y2="240" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- how it looks: bowed upward -->
  <path d="M60,240 Q225,160 390,240" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <!-- hands -->
  <circle cx="60" cy="240" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="390" cy="240" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="225" y="182" font-size="20" fill="#b91c1c" text-anchor="middle">how it looks: bowed up</text>
  <text x="225" y="276" font-size="20" fill="#1f2937" text-anchor="middle">what it is: straight, level</text>
  <text x="225" y="432" font-size="20" font-style="italic" fill="#1f2937" text-anchor="middle">straight in space, curved in view</text>

  <!-- divider -->
  <line x1="450" y1="20" x2="450" y2="440" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== Panel B: the chain ===== -->
  <text x="475" y="46" font-size="24" fill="#1f2937">B. Where is the trick?</text>
  <!-- observation to inference bracket -->
  <text x="475" y="130" font-size="20" fill="#1f2937">observation</text>
  <text x="885" y="130" font-size="20" fill="#b91c1c" text-anchor="end">inference</text>
  <line x1="476" y1="172" x2="476" y2="156" stroke="#1f2937" stroke-width="2"/>
  <line x1="476" y1="156" x2="884" y2="156" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- four boxes: x = 475, 583, 691, 799; width 86; gaps 22 -->
  <rect x="475" y="200" width="86" height="50" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="583" y="200" width="86" height="50" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="691" y="200" width="86" height="50" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="799" y="200" width="86" height="50" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <text x="518" y="232" font-size="20" fill="#1f2937" text-anchor="middle">object</text>
  <text x="626" y="232" font-size="20" fill="#1f2937" text-anchor="middle">light</text>
  <text x="734" y="232" font-size="20" fill="#1f2937" text-anchor="middle">eye</text>
  <text x="842" y="232" font-size="20" fill="#1f2937" text-anchor="middle">brain</text>
  <!-- arrows between boxes -->
  <line x1="562" y1="225" x2="582" y2="225" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="225" x2="690" y2="225" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="778" y1="225" x2="798" y2="225" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- a test for each link -->
  <text x="680" y="296" font-size="20" fill="#6b7280" text-anchor="middle">check each link with:</text>
  <text x="518" y="334" font-size="20" fill="#1f2937" text-anchor="middle">ruler</text>
  <text x="626" y="334" font-size="20" fill="#1f2937" text-anchor="middle">light</text>
  <text x="626" y="358" font-size="20" fill="#1f2937" text-anchor="middle">meter</text>
  <text x="734" y="334" font-size="20" fill="#1f2937" text-anchor="middle">camera</text>
  <text x="842" y="334" font-size="20" fill="#1f2937" text-anchor="middle">another</text>
  <text x="842" y="358" font-size="20" fill="#1f2937" text-anchor="middle">observer</text>
  <text x="680" y="432" font-size="20" font-style="italic" fill="#1f2937" text-anchor="middle">swap a link, see if the effect stays</text>
</svg>
