<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d">
  <title id="t">The Salvation of Doug: experiment ledger</title>
  <desc id="d">Workers enter a factory in the morning, one with hands tied; cars leave in the afternoon, one missing its steering wheel. Below, a three-column table separates each day's manipulation, the observed fact, and the geneticist's explanation.</desc>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <g font-family="Montserrat, Helvetica, Arial, sans-serif" fill="#1f2937">

    <!-- hill with two observers -->
    <path d="M 20 90 Q 110 20 200 90" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
    <g stroke="#1f2937" stroke-width="2.5" fill="#ffffff">
      <circle cx="90" cy="48" r="6"/>
      <path d="M 90 54 L 90 68 L 102 72 M 90 60 L 80 66 M 90 60 L 100 62"/>
      <circle cx="130" cy="48" r="6"/>
      <path d="M 130 54 L 130 68 L 118 72 M 130 60 L 140 66 M 130 60 L 120 62"/>
      <rect x="107" y="62" width="7" height="8" rx="1"/>
    </g>
    <text x="110" y="112" font-size="20" text-anchor="middle">Doug and the geneticist</text>

    <!-- workers entering -->
    <g stroke="#1f2937" stroke-width="2.5" fill="#ffffff">
      <circle cx="60" cy="140" r="7"/>
      <path d="M 60 147 L 60 170 M 60 153 L 48 166 M 60 153 L 72 166 M 60 170 L 52 186 M 60 170 L 68 186"/>
      <circle cx="115" cy="140" r="7"/>
      <path d="M 115 147 L 115 170 M 115 153 L 108 168 M 115 153 L 122 168 M 115 170 L 107 186 M 115 170 L 123 186"/>
      <circle cx="170" cy="140" r="7"/>
      <path d="M 170 147 L 170 170 M 170 153 L 158 166 M 170 153 L 182 166 M 170 170 L 162 186 M 170 170 L 178 186"/>
    </g>
    <ellipse cx="115" cy="169" rx="9" ry="4" fill="none" stroke="#b91c1c" stroke-width="3"/>
    <text x="115" y="206" font-size="18" text-anchor="middle" fill="#b91c1c">hands tied</text>
    <text x="115" y="228" font-size="18" text-anchor="middle">workers in (morning)</text>
    <path d="M 200 160 L 240 160" stroke="#1f2937" stroke-width="2.5" fill="none"/>
    <path d="M 232 154 L 242 160 L 232 166 Z" fill="#1f2937"/>

    <!-- factory -->
    <rect x="250" y="80" width="300" height="120" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <path d="M 250 80 L 290 55 L 290 80 M 330 80 L 370 55 L 370 80 M 410 80 L 450 55 L 450 80 M 490 80 L 530 55 L 530 80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
    <text x="400" y="150" font-size="26" font-weight="bold" text-anchor="middle">FACTORY</text>

    <!-- cars leaving -->
    <path d="M 556 160 L 596 160" stroke="#1f2937" stroke-width="2.5" fill="none"/>
    <path d="M 588 154 L 598 160 L 588 166 Z" fill="#1f2937"/>
    <g stroke="#1f2937" stroke-width="2.5" fill="#ffffff">
      <path d="M 606 172 L 606 158 L 616 148 L 636 148 L 644 158 L 656 158 L 656 172 Z"/>
      <circle cx="616" cy="174" r="5"/><circle cx="646" cy="174" r="5"/>
      <circle cx="628" cy="160" r="3" fill="#1f2937"/>
      <path d="M 666 172 L 666 158 L 676 148 L 696 148 L 704 158 L 716 158 L 716 172 Z"/>
      <circle cx="676" cy="174" r="5"/><circle cx="706" cy="174" r="5"/>
      <circle cx="688" cy="160" r="3" fill="#1f2937"/>
      <path d="M 720 172 L 720 158 L 730 148 L 750 148 L 758 158 L 770 158 L 770 172 Z"/>
      <circle cx="730" cy="174" r="5"/><circle cx="760" cy="174" r="5"/>
    </g>
    <text x="740" y="138" font-size="16" text-anchor="middle" fill="#b91c1c">no wheel</text>
    <text x="685" y="206" font-size="18" text-anchor="middle">cars out (afternoon)</text>

    <!-- ledger table -->
    <g stroke="#1f2937" stroke-width="2.5">
      <rect x="20" y="248" width="760" height="40" fill="#e5e7eb"/>
      <rect x="20" y="288" width="760" height="216" fill="#ffffff"/>
      <rect x="200" y="288" width="270" height="216" fill="#f3f4f6"/>
      <line x1="200" y1="248" x2="200" y2="504"/>
      <line x1="470" y1="248" x2="470" y2="504"/>
      <line x1="20" y1="360" x2="780" y2="360"/>
      <line x1="20" y1="432" x2="780" y2="432"/>
    </g>
    <g font-size="20" font-weight="bold">
      <text x="110" y="275" text-anchor="middle">Manipulation</text>
      <text x="335" y="275" text-anchor="middle">Observation (fact)</text>
      <text x="625" y="275" text-anchor="middle">Pronouncement</text>
    </g>
    <g font-size="20">
      <text x="30" y="318">worker A,</text>
      <text x="30" y="342">hands tied</text>
      <text x="210" y="308">no front or rear</text>
      <text x="210" y="330">windows; side</text>
      <text x="210" y="352">windows present</text>
      <text x="480" y="308">A installs windows;</text>
      <text x="480" y="330">side windows are a</text>
      <text x="480" y="352">separate process</text>

      <text x="30" y="390">worker B,</text>
      <text x="30" y="414">hands tied</text>
      <text x="210" y="380">no steering wheels;</text>
      <text x="210" y="402">cars pile up at the</text>
      <text x="210" y="424">first bend</text>
      <text x="480" y="380">B installs wheels;</text>
      <text x="480" y="402">steering wheels are</text>
      <text x="480" y="424">responsible for turning</text>

      <text x="30" y="462">vice president,</text>
      <text x="30" y="486">hands tied</text>
      <text x="210" y="474">no visible change</text>
      <text x="480" y="452">VP does nothing</text>
      <text x="480" y="474" fill="#b91c1c">alt.: other VPs</text>
      <text x="480" y="496" fill="#b91c1c">cover for him (Doug)</text>
    </g>
    <text x="400" y="538" font-size="20" font-style="italic" text-anchor="middle">Only the middle column is what they saw.</text>
  </g>
</svg>
