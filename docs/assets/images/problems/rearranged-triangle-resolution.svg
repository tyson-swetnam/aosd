<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>

  <text x="80" y="34" font-size="22" fill="#1f2937">Neither outline is a triangle: the long edge is bent</text>

  <!-- unit grid, 13 x 5, origin (80,330), 48 px per unit -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="330" x2="704" y2="330"/>
    <line x1="80" y1="282" x2="704" y2="282"/>
    <line x1="80" y1="234" x2="704" y2="234"/>
    <line x1="80" y1="186" x2="704" y2="186"/>
    <line x1="80" y1="138" x2="704" y2="138"/>
    <line x1="80" y1="90"  x2="704" y2="90"/>
    <line x1="80"  y1="90" x2="80"  y2="330"/>
    <line x1="128" y1="90" x2="128" y2="330"/>
    <line x1="176" y1="90" x2="176" y2="330"/>
    <line x1="224" y1="90" x2="224" y2="330"/>
    <line x1="272" y1="90" x2="272" y2="330"/>
    <line x1="320" y1="90" x2="320" y2="330"/>
    <line x1="368" y1="90" x2="368" y2="330"/>
    <line x1="416" y1="90" x2="416" y2="330"/>
    <line x1="464" y1="90" x2="464" y2="330"/>
    <line x1="512" y1="90" x2="512" y2="330"/>
    <line x1="560" y1="90" x2="560" y2="330"/>
    <line x1="608" y1="90" x2="608" y2="330"/>
    <line x1="656" y1="90" x2="656" y2="330"/>
    <line x1="704" y1="90" x2="704" y2="330"/>
  </g>

  <!-- the sliver: parallelogram (0,0) (5,2) (13,5) (8,3) -->
  <polygon points="80,330 320,234 704,90 464,186" fill="#9ca3af" fill-opacity="0.55" stroke="none"/>

  <!-- base and vertical leg -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M 80 330 L 704 330 L 704 90"/>
  </g>

  <!-- true straight line from (0,0) to (13,5) -->
  <line x1="80" y1="330" x2="704" y2="90" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- arrangement 1: bend at (8,3), dips below -->
  <polyline points="80,330 464,186 704,90" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <!-- arrangement 2: bend at (5,2), bulges above -->
  <polyline points="80,330 320,234 704,90" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <g fill="#1f2937">
    <circle cx="320" cy="234" r="5" fill="#1d4ed8"/>
    <circle cx="464" cy="186" r="5" fill="#b91c1c"/>
    <circle cx="80" cy="330" r="5"/>
    <circle cx="704" cy="90" r="5"/>
  </g>

  <g font-size="20" fill="#1f2937">
    <text x="300" y="268">(5, 2)</text>
    <text x="452" y="164">(8, 3)</text>
    <text x="92" y="318">(0, 0)</text>
    <text x="648" y="76">(13, 5)</text>
  </g>

  <!-- callout to the sliver -->
  <line x1="272" y1="164" x2="392" y2="206" stroke="#1f2937" stroke-width="2"/>
  <text x="86" y="158" font-size="20" fill="#1f2937">the sliver between them: area = 1</text>

  <!-- legend -->
  <g font-size="19" fill="#1f2937">
    <line x1="80" y1="374" x2="128" y2="374" stroke="#b91c1c" stroke-width="3"/>
    <text x="140" y="381">Arrangement 1 bends at (8, 3): slope 3/8 = 0.375, then 2/5 = 0.400</text>
    <line x1="80" y1="404" x2="128" y2="404" stroke="#1d4ed8" stroke-width="3"/>
    <text x="140" y="411">Arrangement 2 bends at (5, 2): slope 2/5 = 0.400, then 3/8 = 0.375</text>
    <line x1="80" y1="434" x2="128" y2="434" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="140" y="441">A real hypotenuse would have slope 5/13 = 0.385 all the way</text>
  </g>
</svg>
