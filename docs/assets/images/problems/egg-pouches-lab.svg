<text x="630" y="117" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#1f2937">the generalization lives here,</text>
<text x="630" y="143" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#1f2937">not in any one chain,</text>
<text x="630" y="169" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#1f2937">if there is one</text>
