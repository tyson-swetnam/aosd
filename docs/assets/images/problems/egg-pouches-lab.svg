<title id="t">A chain of egg pouches, and four chains pooled</title>
<desc id="d">Left: a curved chain of eighteen lens-shaped pouches of unequal, unordered sizes on one stalk. Right: contents counted against pouch number for four specimens of different lengths, with no trend line.</desc>
