<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t"><title id="t">The Lo Shu magic square with its eight lines, each summing to 15</title>
<rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
<g transform="translate(-75,0)">
<rect x="250" y="60" width="100" height="100" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<rect x="350" y="60" width="100" height="100" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<rect x="450" y="60" width="100" height="100" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<rect x="250" y="160" width="100" height="100" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<rect x="350" y="160" width="100" height="100" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
<rect x="450" y="160" width="100" height="100" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<rect x="250" y="260" width="100" height="100" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<rect x="350" y="260" width="100" height="100" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<rect x="450" y="260" width="100" height="100" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<rect x="250" y="60" width="300" height="300" fill="none" stroke="#1f2937" stroke-width="3"/>
<line x1="235" y1="110" x2="565" y2="110" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="235" y1="210" x2="565" y2="210" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="235" y1="310" x2="565" y2="310" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="300" y1="45" x2="300" y2="375" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="400" y1="45" x2="400" y2="375" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="500" y1="45" x2="500" y2="375" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="235" y1="45" x2="565" y2="375" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<line x1="565" y1="45" x2="235" y2="375" stroke="#b91c1c" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
<text x="300" y="125" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">4</text>
<text x="400" y="125" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">9</text>
<text x="500" y="125" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">2</text>
<text x="300" y="225" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">3</text>
<text x="400" y="225" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">5</text>
<text x="500" y="225" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">7</text>
<text x="300" y="325" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">8</text>
<text x="400" y="325" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">1</text>
<text x="500" y="325" text-anchor="middle" font-size="44" font-weight="600" fill="#1f2937" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family="Montserrat, Helvetica, Arial, sans-serif">6</text>
<text x="580" y="118" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">4+9+2 = 15</text>
<text x="580" y="218" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">3+5+7 = 15</text>
<text x="580" y="318" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">8+1+6 = 15</text>
<text x="300" y="402" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">4+3+8</text>
<text x="300" y="428" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">= 15</text>
<text x="400" y="402" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">9+5+1</text>
<text x="400" y="428" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">= 15</text>
<text x="500" y="402" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">2+7+6</text>
<text x="500" y="428" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">= 15</text>
<text x="580" y="45" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">2+5+8 = 15</text>
<text x="580" y="392" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">4+5+6 = 15</text>
</g>
<text x="400" y="478" text-anchor="middle" font-size="22" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">The eight triples that sum to 15 are the eight lines of the square.</text>
</svg>
