<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="title desc">
  <title id="title">The 13 nails problem: the solution</title>
  <desc id="desc">Side view of the finished bundle: a bottom rail nail resting across the head of the fixed nail, eleven cross nails hanging from it with their heads alternating sides, and a top nail laid head-to-tail on the rail to lock them, with the bundle's centre of gravity marked below the support point.</desc>
  <rect x="0" y="0" width="560" height="470" fill="#ffffff"/>

  <g font-family="Montserrat, Helvetica, Arial, sans-serif" fill="#1f2937">
    <text x="280" y="42" font-size="26" font-weight="bold" text-anchor="middle">The finished bundle (side view)</text>
  </g>

  <!-- block -->
  <rect x="170" y="296" width="220" height="40" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
  <!-- fixed nail -->
  <line x1="280" y1="296" x2="280" y2="178" stroke="#1f2937" stroke-width="3"/>
  <rect x="272" y="173" width="16" height="5" fill="#1f2937"/>

  <!-- cross nails, seen end-on, hanging below the rails -->
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="195" y1="166" x2="173" y2="236"/>
    <line x1="229" y1="166" x2="207" y2="236"/>
    <line x1="263" y1="166" x2="241" y2="236"/>
    <line x1="297" y1="166" x2="275" y2="236"/>
    <line x1="331" y1="166" x2="309" y2="236"/>
    <line x1="365" y1="166" x2="343" y2="236"/>
    <line x1="212" y1="166" x2="234" y2="236"/>
    <line x1="246" y1="166" x2="268" y2="236"/>
    <line x1="280" y1="166" x2="302" y2="236"/>
    <line x1="314" y1="166" x2="336" y2="236"/>
    <line x1="348" y1="166" x2="370" y2="236"/>
  </g>
  <!-- heads of the cross nails, hooked between the two rails: near side red, far side grey -->
  <g>
    <circle cx="195" cy="166" r="4" fill="#b91c1c"/>
    <circle cx="229" cy="166" r="4" fill="#b91c1c"/>
    <circle cx="263" cy="166" r="4" fill="#b91c1c"/>
    <circle cx="297" cy="166" r="4" fill="#b91c1c"/>
    <circle cx="331" cy="166" r="4" fill="#b91c1c"/>
    <circle cx="365" cy="166" r="4" fill="#b91c1c"/>
    <circle cx="212" cy="166" r="4" fill="#9ca3af"/>
    <circle cx="246" cy="166" r="4" fill="#9ca3af"/>
    <circle cx="280" cy="166" r="4" fill="#9ca3af"/>
    <circle cx="314" cy="166" r="4" fill="#9ca3af"/>
    <circle cx="348" cy="166" r="4" fill="#9ca3af"/>
  </g>

  <!-- bottom rail nail: head at left, point at right; rests on the fixed nail head -->
  <line x1="180" y1="172" x2="380" y2="172" stroke="#1f2937" stroke-width="3"/>
  <rect x="177" y="167" width="5" height="10" fill="#1f2937"/>
  <polygon points="380,172 370,168 370,176" fill="#1f2937"/>
  <!-- top lock nail: head at right, point at left -->
  <line x1="180" y1="160" x2="380" y2="160" stroke="#1f2937" stroke-width="3"/>
  <rect x="378" y="155" width="5" height="10" fill="#1f2937"/>
  <polygon points="180,160 190,156 190,164" fill="#1f2937"/>

  <!-- centre of gravity of the bundle -->
  <line x1="280" y1="178" x2="280" y2="216" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="280" cy="216" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>

  <g font-family="Montserrat, Helvetica, Arial, sans-serif" fill="#1f2937" font-size="20">
    <text x="280" y="104" text-anchor="middle">lock (top nail, reversed)</text>
    <line x1="280" y1="111" x2="280" y2="150" stroke="#1f2937" stroke-width="1.5"/>
    <polygon points="280,156 276,147 284,147" fill="#1f2937"/>

    <text x="400" y="198" text-anchor="start">rail</text>
    <text x="400" y="220" text-anchor="start">(bottom nail)</text>
    <line x1="396" y1="192" x2="382" y2="174" stroke="#1f2937" stroke-width="1.5"/>

    <text x="300" y="268" text-anchor="start">fixed nail in the block</text>

    <text x="160" y="296" text-anchor="end" fill="#b91c1c">centre of gravity</text>
    <text x="160" y="318" text-anchor="end" fill="#b91c1c">below the support</text>
    <line x1="166" y1="290" x2="272" y2="221" stroke="#b91c1c" stroke-width="1.5"/>

    <text x="280" y="404" text-anchor="middle">Cross nails hang from the rails, heads</text>
    <text x="280" y="430" text-anchor="middle">alternating sides; assemble flat, then lift.</text>
  </g>
</svg>
