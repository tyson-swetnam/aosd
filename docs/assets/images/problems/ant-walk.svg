<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Wire-frame diagrams of a cube and an octahedron with the number of edges meeting at each corner">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <g font-family="Montserrat, Helvetica, Arial, sans-serif">

    <!-- Headings -->
    <text x="210" y="42" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Cube</text>
    <text x="590" y="42" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">Octahedron</text>

    <!-- ===== Cube: two nested squares, 8 corners, 12 edges ===== -->
    <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none">
      <rect x="150" y="180" width="120" height="120" fill="#f3f4f6"/>
      <rect x="70" y="100" width="280" height="280"/>
      <line x1="70" y1="100" x2="150" y2="180"/>
      <line x1="350" y1="100" x2="270" y2="180"/>
      <line x1="350" y1="380" x2="270" y2="300"/>
      <line x1="70" y1="380" x2="150" y2="300"/>
    </g>
    <g fill="#1f2937">
      <circle cx="70" cy="100" r="6"/>
      <circle cx="350" cy="100" r="6"/>
      <circle cx="350" cy="380" r="6"/>
      <circle cx="70" cy="380" r="6"/>
      <circle cx="150" cy="180" r="6"/>
      <circle cx="270" cy="180" r="6"/>
      <circle cx="270" cy="300" r="6"/>
      <circle cx="150" cy="300" r="6"/>
    </g>
    <g font-size="20" fill="#6b7280" text-anchor="middle">
      <text x="44" y="92">3</text>
      <text x="376" y="92">3</text>
      <text x="376" y="400">3</text>
      <text x="44" y="400">3</text>
      <text x="176" y="208">3</text>
      <text x="244" y="208">3</text>
      <text x="244" y="278">3</text>
      <text x="176" y="278">3</text>
    </g>
    <circle cx="70" cy="100" r="9" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>

    <!-- ===== Octahedron: Dudeney-style projection, 6 corners, 12 edges ===== -->
    <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none">
      <polygon points="529,180 651,180 590,300" fill="#e5e7eb"/>
      <polygon points="590,100 450,380 730,380"/>
      <line x1="590" y1="100" x2="529" y2="180"/>
      <line x1="590" y1="100" x2="651" y2="180"/>
      <line x1="450" y1="380" x2="529" y2="180"/>
      <line x1="450" y1="380" x2="590" y2="300"/>
      <line x1="730" y1="380" x2="651" y2="180"/>
      <line x1="730" y1="380" x2="590" y2="300"/>
    </g>
    <g fill="#1f2937">
      <circle cx="590" cy="100" r="6"/>
      <circle cx="450" cy="380" r="6"/>
      <circle cx="730" cy="380" r="6"/>
      <circle cx="529" cy="180" r="6"/>
      <circle cx="651" cy="180" r="6"/>
      <circle cx="590" cy="300" r="6"/>
    </g>
    <g font-size="20" fill="#6b7280" text-anchor="middle">
      <text x="562" y="76">4</text>
      <text x="424" y="398">4</text>
      <text x="756" y="398">4</text>
      <text x="556" y="208">4</text>
      <text x="624" y="208">4</text>
      <text x="590" y="284">4</text>
    </g>
    <text x="616" y="94" font-size="22" font-weight="700" fill="#1f2937">A</text>
    <circle cx="590" cy="100" r="9" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>

    <!-- Captions -->
    <g font-size="20" fill="#1f2937" text-anchor="middle">
      <text x="210" y="430">8 corners, 12 edges,</text>
      <text x="210" y="454">three at every corner</text>
      <text x="590" y="430">6 corners, 12 edges,</text>
      <text x="590" y="454">four at every corner</text>
    </g>
    <text x="400" y="488" font-size="17" fill="#6b7280" text-anchor="middle">Grey numbers count the wires meeting at each corner. The red dot is the ant.</text>

  </g>
</svg>
