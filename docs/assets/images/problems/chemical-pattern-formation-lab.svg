<text x="600" y="392" font-size="20" text-anchor="middle">A broken front curls into two spirals,</text>
<text x="600" y="418" font-size="20" text-anchor="middle">turning opposite ways about their tips.</text>
<text x="400" y="464" font-size="20" text-anchor="middle">Blue = oxidised front; pink = resting reagent. Colliding fronts annihilate.</text>
