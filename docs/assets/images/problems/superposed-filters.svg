<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 930" width="960" height="930" font-family="Montserrat, Helvetica, Arial, sans-serif">
<title>Three stacks of polarizing filters and the cos-squared law</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="big" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="960" height="930" fill="#ffffff"/>
<text x="150" y="42" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">A. Parallel</text>
<circle cx="150" cy="100" r="28" fill="#f5e6a8" stroke="#1f2937" stroke-width="2"/>
<text x="192" y="107" font-size="20" fill="#1f2937">bright</text>
<line x1="75" y1="480" x2="75" y2="140" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="63" y="310" font-size="20" fill="#1f2937" text-anchor="middle" transform="rotate(-90 63 310)">unpolarized light</text>
<rect x="110" y="380" width="80" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<line x1="150.0" y1="449.0" x2="150.0" y2="391.0" stroke="#1f2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="212" y="427" font-size="22" fill="#1f2937">0°</text>
<rect x="110" y="160" width="80" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<line x1="150.0" y1="229.0" x2="150.0" y2="171.0" stroke="#1f2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="212" y="207" font-size="22" fill="#1f2937">0°</text>
<text x="150" y="514" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">passes about 50%</text>
<text x="430" y="42" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">B. Crossed</text>
<circle cx="430" cy="100" r="28" fill="#111111" stroke="#1f2937" stroke-width="2"/>
<text x="472" y="107" font-size="20" fill="#1f2937">black</text>
<line x1="355" y1="480" x2="355" y2="140" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="390" y="380" width="80" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<line x1="430.0" y1="449.0" x2="430.0" y2="391.0" stroke="#1f2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="492" y="427" font-size="22" fill="#1f2937">0°</text>
<rect x="390" y="160" width="80" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<line x1="401.0" y1="200.0" x2="459.0" y2="200.0" stroke="#1f2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="492" y="207" font-size="22" fill="#1f2937">90°</text>
<text x="430" y="514" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">passes 0%</text>
<text x="790" y="42" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">C. One filter between</text>
<circle cx="790" cy="100" r="28" fill="#9a9a9a" stroke="#1f2937" stroke-width="2"/>
<text x="832" y="107" font-size="20" fill="#1f2937">dim</text>
<line x1="715" y1="480" x2="715" y2="140" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="750" y="380" width="80" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<line x1="790.0" y1="449.0" x2="790.0" y2="391.0" stroke="#1f2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="852" y="427" font-size="22" fill="#1f2937">0°</text>
<rect x="750" y="270" width="80" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<rect x="742" y="262" width="96" height="96" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="769.5" y1="330.5" x2="810.5" y2="289.5" stroke="#1f2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="852" y="317" font-size="22" fill="#1f2937">45°</text>
<rect x="750" y="160" width="80" height="80" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
<line x1="761.0" y1="200.0" x2="819.0" y2="200.0" stroke="#1f2937" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="852" y="207" font-size="22" fill="#1f2937">90°</text>
<text x="852" y="344" font-size="20" fill="#b91c1c">inserted</text>
<text x="790" y="514" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">passes about 12.5%</text>
<text x="790" y="542" font-size="20" fill="#1f2937" text-anchor="middle">(25% of what leaves filter 1)</text>
<text x="600" y="262" font-size="20" fill="#b91c1c" text-anchor="middle">add one</text>
<text x="600" y="286" font-size="20" fill="#b91c1c" text-anchor="middle">more filter</text>
<line x1="545" y1="312" x2="660" y2="312" stroke="#b91c1c" stroke-width="6" marker-end="url(#big)"/>
<text x="480" y="594" font-size="22" fill="#1f2937" text-anchor="middle">C: 1/2 × cos²45° × cos²45° = 1/2 × 1/2 × 1/2 = 1/8 of the light in</text>
<line x1="40" y1="614" x2="920" y2="614" stroke="#e5e7eb" stroke-width="2"/>
<text x="480" y="650" font-size="20" fill="#1f2937" text-anchor="middle">Two filters: share of the light from filter 1 that passes filter 2</text>
<line x1="140" y1="750.0" x2="860" y2="750.0" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="140" y1="680" x2="860" y2="680" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="140" y1="820" x2="860" y2="820" stroke="#1f2937" stroke-width="2"/>
<line x1="140" y1="820" x2="140" y2="670" stroke="#1f2937" stroke-width="2"/>
<line x1="140" y1="820" x2="140" y2="828" stroke="#1f2937" stroke-width="2"/>
<text x="140" y="852" font-size="20" fill="#1f2937" text-anchor="middle">0°</text>
<line x1="320" y1="820" x2="320" y2="828" stroke="#1f2937" stroke-width="2"/>
<text x="320" y="852" font-size="20" fill="#1f2937" text-anchor="middle">90°</text>
<line x1="500" y1="820" x2="500" y2="828" stroke="#1f2937" stroke-width="2"/>
<text x="500" y="852" font-size="20" fill="#1f2937" text-anchor="middle">180°</text>
<line x1="680" y1="820" x2="680" y2="828" stroke="#1f2937" stroke-width="2"/>
<text x="680" y="852" font-size="20" fill="#1f2937" text-anchor="middle">270°</text>
<line x1="860" y1="820" x2="860" y2="828" stroke="#1f2937" stroke-width="2"/>
<text x="860" y="852" font-size="20" fill="#1f2937" text-anchor="middle">360°</text>
<text x="128" y="687" font-size="20" fill="#1f2937" text-anchor="end">1</text>
<text x="128" y="757.0" font-size="20" fill="#1f2937" text-anchor="end">1/2</text>
<text x="128" y="827" font-size="20" fill="#1f2937" text-anchor="end">0</text>
<polyline points="140.0,680.0 146.0,680.4 152.0,681.5 158.0,683.4 164.0,686.1 170.0,689.4 176.0,693.4 182.0,698.0 188.0,703.2 194.0,708.9 200.0,715.0 206.0,721.5 212.0,728.4 218.0,735.4 224.0,742.7 230.0,750.0 236.0,757.3 242.0,764.6 248.0,771.6 254.0,778.5 260.0,785.0 266.0,791.1 272.0,796.8 278.0,802.0 284.0,806.6 290.0,810.6 296.0,813.9 302.0,816.6 308.0,818.5 314.0,819.6 320.0,820.0 326.0,819.6 332.0,818.5 338.0,816.6 344.0,813.9 350.0,810.6 356.0,806.6 362.0,802.0 368.0,796.8 374.0,791.1 380.0,785.0 386.0,778.5 392.0,771.6 398.0,764.6 404.0,757.3 410.0,750.0 416.0,742.7 422.0,735.4 428.0,728.4 434.0,721.5 440.0,715.0 446.0,708.9 452.0,703.2 458.0,698.0 464.0,693.4 470.0,689.4 476.0,686.1 482.0,683.4 488.0,681.5 494.0,680.4 500.0,680.0 506.0,680.4 512.0,681.5 518.0,683.4 524.0,686.1 530.0,689.4 536.0,693.4 542.0,698.0 548.0,703.2 554.0,708.9 560.0,715.0 566.0,721.5 572.0,728.4 578.0,735.4 584.0,742.7 590.0,750.0 596.0,757.3 602.0,764.6 608.0,771.6 614.0,778.5 620.0,785.0 626.0,791.1 632.0,796.8 638.0,802.0 644.0,806.6 650.0,810.6 656.0,813.9 662.0,816.6 668.0,818.5 674.0,819.6 680.0,820.0 686.0,819.6 692.0,818.5 698.0,816.6 704.0,813.9 710.0,810.6 716.0,806.6 722.0,802.0 728.0,796.8 734.0,791.1 740.0,785.0 746.0,778.5 752.0,771.6 758.0,764.6 764.0,757.3 770.0,750.0 776.0,742.7 782.0,735.4 788.0,728.4 794.0,721.5 800.0,715.0 806.0,708.9 812.0,703.2 818.0,698.0 824.0,693.4 830.0,689.4 836.0,686.1 842.0,683.4 848.0,681.5 854.0,680.4 860.0,680.0" fill="none" stroke="#1f2937" stroke-width="3"/>
<circle cx="320" cy="820" r="7" fill="#b91c1c"/>
<circle cx="680" cy="820" r="7" fill="#b91c1c"/>
<text x="870" y="687" font-size="22" fill="#1f2937">cos²θ</text>
<text x="480" y="882" font-size="20" fill="#1f2937" text-anchor="middle">θ = angle between the two axes</text>
<text x="480" y="912" font-size="20" fill="#b91c1c" text-anchor="middle">dark twice per full turn, at 90° and 270°: only θ mod 180° matters</text>
</svg>
