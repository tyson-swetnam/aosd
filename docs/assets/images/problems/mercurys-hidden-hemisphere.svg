<text x="596.0" y="392.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">Positions 1 to 6 are one orbit. The red</text>
<text x="596.0" y="414.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">marker turns 90 degrees for every 60</text>
<text x="596.0" y="436.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">degrees of orbit: one and a half turns.</text>
<text x="20.0" y="478.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937" text-anchor="start">Mercury at three successive perihelion passages (the Sun is red)</text>
