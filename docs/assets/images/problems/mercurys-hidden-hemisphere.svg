<text x="200.0" y="312.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">1 orbit = 88 days</text>
<text x="200.0" y="392.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">Rotation equals orbit: one face</text>
<text x="200.0" y="414.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">always sunlit, the other forever</text>
<text x="200.0" y="436.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">dark and never seen.</text>
<text x="596.0" y="28.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937" text-anchor="middle">What radar found (1965)</text>
<text x="596.0" y="54.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">three rotations per two orbits (3:2)</text>
