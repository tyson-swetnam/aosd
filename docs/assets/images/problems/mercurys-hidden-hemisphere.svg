<circle cx="620" cy="524" r="13" fill="#b91c1c" stroke="#1f2937" stroke-width="2"/>
<circle cx="690" cy="524" r="16" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
<line x1="690" y1="524" x2="662" y2="524" stroke="#b91c1c" stroke-width="3"/>
<text x="690.0" y="562.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#1f2937" text-anchor="middle">two orbits later</text>
<text x="400.0" y="596.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">Each orbit turns the planet one and a half times, so the marker faces</text>
<text x="400.0" y="618.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="middle">the Sun again only at every second perihelion.</text>
<text x="20.0" y="662.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937" text-anchor="start">Periods to scale, in Earth days</text>
