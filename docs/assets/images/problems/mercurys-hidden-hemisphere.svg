<text x="20.0" y="727.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="start">synodic period  115.9 d</text>
<rect x="290" y="742" width="470.0" height="22" fill="#e5e7eb" stroke="#b91c1c" stroke-width="3"/>
<text x="20.0" y="759.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#1f2937" text-anchor="start">two rotations  117.3 d</text>
<text x="400.0" y="784.0" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#b91c1c" text-anchor="middle">115.9 and 117.3 are nearly equal: the same face at every apparition.</text>
