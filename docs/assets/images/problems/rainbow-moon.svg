<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="800" height="850" font-family="Montserrat, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Where a Rainbow Moon can happen</title>
  <desc id="d">Top: the sky opposite a Sun 10 degrees up. The primary rainbow is a ring of radius 41 degrees (band 40 to 42 degrees) and the secondary a ring of 51 degrees, both centred on the antisolar point 10 degrees below the horizon. The Moon sits inside the primary band 41 degrees from that point. Bottom: the Moon's elongation from the Sun over one lunar month, 0 to 360 degrees, with the phases marked and the two crossings of the band at 139 and 221 degrees, about 81 hours before and after full moon. Scale in the top panel: 5 px per degree. Scale in the bottom panel: 680 px for 360 degrees.</desc>
  <defs>
    <clipPath id="sky">
      <rect x="0" y="0" width="800" height="330"/>
    </clipPath>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="850" fill="#ffffff"/>

  <!-- ===== Panel 1: sky view, 5 px per degree ===== -->
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Facing away from the Sun (Sun 10° up, behind you)</text>

  <!-- ground -->
  <rect x="0" y="330" width="800" height="130" fill="#f3f4f6"/>
  <line x1="0" y1="330" x2="800" y2="330" stroke="#1f2937" stroke-width="3"/>
  <text x="16" y="322" font-size="20" fill="#1f2937">horizon</text>

  <g clip-path="url(#sky)" fill="none">
    <!-- secondary bow, 51 deg = 255 px -->
    <circle cx="400" cy="380" r="255" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="10 7"/>
    <!-- primary bow band, 40 deg (200 px) to 42 deg (210 px); violet inside, red outside -->
    <circle cx="400" cy="380" r="201.25" stroke="#6d28d9" stroke-width="2.5"/>
    <circle cx="400" cy="380" r="203.75" stroke="#15803d" stroke-width="2.5"/>
    <circle cx="400" cy="380" r="206.25" stroke="#ca8a04" stroke-width="2.5"/>
    <circle cx="400" cy="380" r="208.75" stroke="#b91c1c" stroke-width="2.5"/>
  </g>

  <!-- 41 deg line from antisolar point to the Moon -->
  <line x1="400" y1="380" x2="255.04" y2="235.04" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="338" y="296" font-size="22" font-weight="700" fill="#b91c1c">41°</text>

  <!-- Moon on the band (drawn enlarged) -->
  <circle cx="255.04" cy="235.04" r="5" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <line x1="150" y1="178" x2="249" y2="229" stroke="#1f2937" stroke-width="2"/>
  <text x="24" y="118" font-size="20" fill="#1f2937">Moon (drawn enlarged),</text>
  <text x="24" y="142" font-size="20" fill="#1f2937">0.5° across, fits</text>
  <text x="24" y="166" font-size="20" fill="#1f2937">inside the 2° band</text>

  <!-- primary label -->
  <line x1="650" y1="176" x2="559" y2="249" stroke="#1f2937" stroke-width="2"/>
  <text x="590" y="142" font-size="20" fill="#1f2937">primary bow:</text>
  <text x="590" y="166" font-size="20" fill="#1f2937">41°, band 2°</text>

  <!-- secondary label -->
  <text x="400" y="90" text-anchor="middle" font-size="20" fill="#4b5563">secondary bow, 51°, colours reversed</text>

  <!-- antisolar point -->
  <g stroke="#1f2937" stroke-width="3">
    <line x1="391" y1="371" x2="409" y2="389"/>
    <line x1="409" y1="371" x2="391" y2="389"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-size="20" fill="#1f2937">antisolar point = shadow of your head,</text>
  <text x="400" y="446" text-anchor="middle" font-size="20" fill="#1f2937">10° below the horizon when the Sun is 10° up</text>

  <line x1="0" y1="475" x2="800" y2="475" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== Panel 2: elongation over one month; x = 60 + deg * 680/360 ===== -->
  <text x="400" y="512" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">One lunar month (29.53 days)</text>

  <!-- crossings of the band: 138-140 and 220-222 degrees -->
  <rect x="320.67" y="560" width="3.78" height="140" fill="#b91c1c"/>
  <rect x="475.56" y="560" width="3.78" height="140" fill="#b91c1c"/>
  <text x="322.56" y="550" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">139°</text>
  <text x="477.44" y="550" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">221°</text>
  <text x="740" y="550" text-anchor="end" font-size="20" fill="#1f2937">about 0.5° per hour</text>

  <!-- Moon path -->
  <line x1="60" y1="600" x2="740" y2="600" stroke="#9ca3af" stroke-width="2"/>
  <!-- new -->
  <circle cx="60" cy="600" r="14" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <!-- first quarter: right half lit -->
  <circle cx="230" cy="600" r="14" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <path d="M230,586 A14,14 0 0 1 230,614 Z" fill="#f3f4f6"/>
  <!-- full -->
  <circle cx="400" cy="600" r="14" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <!-- last quarter: left half lit -->
  <circle cx="570" cy="600" r="14" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>
  <path d="M570,586 A14,14 0 0 0 570,614 Z" fill="#f3f4f6"/>
  <!-- new -->
  <circle cx="740" cy="600" r="14" fill="#1f2937" stroke="#1f2937" stroke-width="2"/>

  <text x="60" y="638" text-anchor="middle" font-size="18" fill="#1f2937">new</text>
  <text x="230" y="638" text-anchor="middle" font-size="18" fill="#1f2937">first quarter</text>
  <text x="400" y="638" text-anchor="middle" font-size="18" fill="#1f2937">full</text>
  <text x="570" y="638" text-anchor="middle" font-size="18" fill="#1f2937">last quarter</text>
  <text x="740" y="638" text-anchor="middle" font-size="18" fill="#1f2937">new</text>

  <!-- 81 h dimension arrows -->
  <line x1="326" y1="672" x2="396" y2="672" stroke="#b91c1c" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="404" y1="672" x2="474" y2="672" stroke="#b91c1c" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="361" y="663" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">81 h</text>
  <text x="439" y="663" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">81 h</text>
  <line x1="400" y1="614" x2="400" y2="700" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- axis -->
  <line x1="60" y1="700" x2="740" y2="700" stroke="#1f2937" stroke-width="3"/>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="60" y1="700" x2="60" y2="712"/>
    <line x1="230" y1="700" x2="230" y2="712"/>
    <line x1="400" y1="700" x2="400" y2="712"/>
    <line x1="570" y1="700" x2="570" y2="712"/>
    <line x1="740" y1="700" x2="740" y2="712"/>
  </g>
  <g font-size="20" fill="#1f2937" text-anchor="middle">
    <text x="60" y="736">0°</text>
    <text x="230" y="736">90°</text>
    <text x="400" y="736">180°</text>
    <text x="570" y="736">270°</text>
    <text x="740" y="736">360°</text>
  </g>
  <text x="400" y="766" text-anchor="middle" font-size="20" fill="#1f2937">Moon's elongation from the Sun (degrees)</text>

  <text x="400" y="806" text-anchor="middle" font-size="20" fill="#1f2937">Elongation 139° or 221° = 41° from the antisolar point.</text>
  <text x="400" y="834" text-anchor="middle" font-size="20" fill="#1f2937">At 0.5° per hour the Moon stays in the 2° band about 4 hours.</text>
</svg>
