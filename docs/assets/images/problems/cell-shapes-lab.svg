<text x="200" y="378" text-anchor="middle" font-size="20" fill="#1f2937">Every inner junction: three</text>
<text x="200" y="405" text-anchor="middle" font-size="20" fill="#1f2937">walls, 120° apart (circled)</text>
<text x="600" y="378" text-anchor="middle" font-size="20" fill="#1f2937">Arrows: in a froth, 5-sided cells</text>
<text x="600" y="405" text-anchor="middle" font-size="20" fill="#1f2937">shrink and 7-sided cells grow</text>
<line x1="40" y1="438" x2="760" y2="438" stroke="#e5e7eb" stroke-width="2"/>
<text x="400" y="474" text-anchor="middle" font-size="20" fill="#1f2937">Right: 5 + 5 + 7 + 7 + 6 + 6 + 6 = 42 sides in 7 cells, still 6 on average</text>
