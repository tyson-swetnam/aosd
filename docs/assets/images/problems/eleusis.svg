<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Montserrat, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Schematic Eleusis layout: a mainline of five accepted cards with sidelines of rejected cards beneath</title>
<rect x="0" y="0" width="800" height="540" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="60" y="36" font-size="22" font-weight="600" fill="#1f2937">mainline: accepted plays, in order</text>
