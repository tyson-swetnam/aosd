<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" aria-labelledby="t"><title id="t">Nine number cards and an empty three-by-three grid</title>
<rect x="0" y="0" width="800" height="510" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Experiment A: the game</text>
<rect x="48" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="80" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">1</text>
<rect x="128" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="160" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">2</text>
<rect x="208" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="240" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">3</text>
<rect x="288" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="320" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">4</text>
<rect x="368" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="400" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">5</text>
<rect x="448" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="480" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">6</text>
<rect x="528" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="560" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">7</text>
<rect x="608" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="640" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">8</text>
<rect x="688" y="50" width="64" height="64" rx="7" fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5"/>
<text x="720" y="93" text-anchor="middle" font-size="30" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">9</text>
<text x="400" y="152" text-anchor="middle" font-size="22" fill="#374151" font-family="Montserrat, Helvetica, Arial, sans-serif">Take cards in turn. First to hold three that sum to 15 wins.</text>
<text x="400" y="205" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2937" font-family="Montserrat, Helvetica, Arial, sans-serif">Experiment B: the square</text>
<rect x="280" y="222" width="240" height="240" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<line x1="360" y1="222" x2="360" y2="462" stroke="#1f2937" stroke-width="2"/>
<line x1="280" y1="302" x2="520" y2="302" stroke="#1f2937" stroke-width="2"/>
<line x1="440" y1="222" x2="440" y2="462" stroke="#1f2937" stroke-width="2"/>
<line x1="280" y1="382" x2="520" y2="382" stroke="#1f2937" stroke-width="2"/>
<text x="400" y="495" text-anchor="middle" font-size="22" fill="#374151" font-family="Montserrat, Helvetica, Arial, sans-serif">Place 1 to 9 so every row, column and diagonal has one sum.</text>
</svg>
