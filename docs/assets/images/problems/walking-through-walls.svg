<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- outer statement -->
  <rect x="20" y="20" width="760" height="460" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <text x="46" y="56" font-size="22" fill="#1f2937">Find a better way to keep two spaces apart,</text>
  <text x="46" y="84" font-size="22" fill="#1f2937">yet let people pass</text>

  <!-- middle statement -->
  <rect x="55" y="100" width="690" height="290" rx="12" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
  <text x="80" y="136" font-size="22" fill="#1f2937">Find a better way to get through a wall</text>

  <!-- inner statement -->
  <rect x="90" y="160" width="380" height="130" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
  <text x="112" y="196" font-size="22" fill="#1f2937">Design a better door</text>

  <!-- door slab pictogram -->
  <rect x="120" y="212" width="54" height="66" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="115" y="224" width="10" height="10" fill="#1f2937"/>
  <rect x="115" y="256" width="10" height="10" fill="#1f2937"/>
  <circle cx="163" cy="245" r="5" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="192" y="252" font-size="19" fill="#1f2937">hinges, slab, handle</text>

  <!-- widening arrow -->
  <text x="492" y="214" font-size="20" fill="#b91c1c">widen the statement</text>
  <line x1="484" y1="240" x2="762" y2="240" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- middle-band pictograms -->
  <!-- round opening -->
  <rect x="145" y="302" width="72" height="48" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <circle cx="181" cy="326" r="17" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="181" y="376" font-size="19" fill="#1f2937" text-anchor="middle">round hole</text>

  <!-- curtain -->
  <line x1="365" y1="302" x2="437" y2="302" stroke="#1f2937" stroke-width="3"/>
  <path d="M 373 302 q 8 12 0 24 q -8 12 0 24" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M 389 302 q 8 12 0 24 q -8 12 0 24" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M 405 302 q 8 12 0 24 q -8 12 0 24" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M 421 302 q 8 12 0 24 q -8 12 0 24" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="401" y="376" font-size="19" fill="#1f2937" text-anchor="middle">curtain</text>

  <!-- revolving door, seen from above -->
  <circle cx="620" cy="326" r="24" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <line x1="620" y1="326" x2="620" y2="302" stroke="#1f2937" stroke-width="2"/>
  <line x1="620" y1="326" x2="599" y2="338" stroke="#1f2937" stroke-width="2"/>
  <line x1="620" y1="326" x2="641" y2="338" stroke="#1f2937" stroke-width="2"/>
  <text x="620" y="376" font-size="19" fill="#1f2937" text-anchor="middle">revolving door</text>

  <!-- outer-band pictogram: air curtain -->
  <line x1="300" y1="404" x2="420" y2="404" stroke="#1f2937" stroke-width="3"/>
  <line x1="300" y1="450" x2="420" y2="450" stroke="#1f2937" stroke-width="3"/>
  <line x1="318" y1="410" x2="318" y2="444" stroke="#1f2937" stroke-width="2"/>
  <line x1="342" y1="410" x2="342" y2="444" stroke="#1f2937" stroke-width="2"/>
  <line x1="366" y1="410" x2="366" y2="444" stroke="#1f2937" stroke-width="2"/>
  <line x1="390" y1="410" x2="390" y2="444" stroke="#1f2937" stroke-width="2"/>
  <line x1="414" y1="410" x2="414" y2="444" stroke="#1f2937" stroke-width="2"/>
  <text x="440" y="434" font-size="19" fill="#1f2937">air curtain</text>
</svg>
