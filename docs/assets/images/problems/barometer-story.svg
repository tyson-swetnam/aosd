<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Six ways to measure the height of a building with the aid of a barometer">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <g id="barom">
      <rect x="0" y="0" width="12" height="36" rx="3" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
      <rect x="2" y="22" width="8" height="12" fill="#b91c1c"/>
      <line x1="7" y1="8" x2="11" y2="8" stroke="#1f2937" stroke-width="1.5"/>
      <line x1="7" y1="14" x2="11" y2="14" stroke="#1f2937" stroke-width="1.5"/>
    </g>
    <g id="baromsm">
      <rect x="0" y="0" width="8" height="24" rx="2" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
      <rect x="1.5" y="15" width="5" height="8" fill="#b91c1c"/>
    </g>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Six ways to find h with the aid of a barometer</text>

  <!-- ===== centre: the building ===== -->
  <line x1="240" y1="560" x2="680" y2="560" stroke="#1f2937" stroke-width="3"/>
  <rect x="390" y="90" width="110" height="470" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
  <g fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5">
    <rect x="404" y="112" width="22" height="26"/><rect x="434" y="112" width="22" height="26"/><rect x="464" y="112" width="22" height="26"/>
    <rect x="404" y="162" width="22" height="26"/><rect x="434" y="162" width="22" height="26"/><rect x="464" y="162" width="22" height="26"/>
    <rect x="404" y="212" width="22" height="26"/><rect x="434" y="212" width="22" height="26"/><rect x="464" y="212" width="22" height="26"/>
    <rect x="404" y="262" width="22" height="26"/><rect x="434" y="262" width="22" height="26"/><rect x="464" y="262" width="22" height="26"/>
    <rect x="404" y="312" width="22" height="26"/><rect x="434" y="312" width="22" height="26"/><rect x="464" y="312" width="22" height="26"/>
    <rect x="404" y="362" width="22" height="26"/><rect x="434" y="362" width="22" height="26"/><rect x="464" y="362" width="22" height="26"/>
    <rect x="404" y="412" width="22" height="26"/><rect x="434" y="412" width="22" height="26"/><rect x="464" y="412" width="22" height="26"/>
  </g>
  <rect x="428" y="508" width="34" height="52" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <circle cx="455" cy="536" r="3" fill="#1f2937"/>
  <line x1="530" y1="90" x2="530" y2="560" stroke="#1f2937" stroke-width="2" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <line x1="500" y1="90" x2="538" y2="90" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="500" y1="560" x2="538" y2="560" stroke="#1f2937" stroke-width="1.5"/>
  <text x="546" y="332" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#b91c1c">h = ?</text>

  <!-- ===== 1. Pressure (top left) ===== -->
  <text x="20" y="82" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">1. Pressure</text>
  <rect x="20" y="90" width="180" height="140" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="60" y1="106" x2="60" y2="214" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 5"/>
  <use href="#barom" x="54" y="106"/>
  <use href="#barom" x="54" y="178"/>
  <text x="80" y="128" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937">p at roof</text>
  <text x="80" y="200" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937">p at street</text>
  <text x="80" y="164" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">difference</text>

  <!-- ===== 2. Rope (middle left) ===== -->
  <text x="20" y="262" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">2. Rope</text>
  <rect x="20" y="270" width="180" height="140" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="40" y1="288" x2="110" y2="288" stroke="#1f2937" stroke-width="3"/>
  <line x1="40" y1="288" x2="40" y2="394" stroke="#1f2937" stroke-width="3"/>
  <line x1="30" y1="394" x2="190" y2="394" stroke="#1f2937" stroke-width="3"/>
  <line x1="110" y1="288" x2="110" y2="356" stroke="#b91c1c" stroke-width="2.5"/>
  <use href="#barom" x="104" y="356"/>
  <line x1="136" y1="288" x2="136" y2="392" stroke="#1f2937" stroke-width="2" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="146" y="346" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">L</text>

  <!-- ===== 3. Shadow (bottom left) ===== -->
  <text x="20" y="442" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">3. Shadow</text>
  <rect x="20" y="450" width="180" height="140" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M 20 484 A 34 34 0 0 0 54 450 L 20 450 Z" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <line x1="58" y1="462" x2="74" y2="478" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="40" y1="492" x2="56" y2="508" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="30" y1="560" x2="190" y2="560" stroke="#1f2937" stroke-width="3"/>
  <rect x="100" y="505" width="12" height="55" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <line x1="112" y1="505" x2="167" y2="560" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="112" y1="562" x2="167" y2="562" stroke="#b91c1c" stroke-width="4"/>
  <use href="#baromsm" x="45" y="536"/>
  <line x1="53" y1="536" x2="77" y2="560" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="53" y1="562" x2="77" y2="562" stroke="#b91c1c" stroke-width="4"/>

  <!-- ===== 4. Free fall (top right) ===== -->
  <text x="700" y="82" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">4. Free fall</text>
  <rect x="700" y="90" width="180" height="140" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="712" y1="106" x2="790" y2="106" stroke="#1f2937" stroke-width="3"/>
  <use href="#barom" x="744" y="120"/>
  <line x1="742" y1="112" x2="736" y2="126" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="758" y1="112" x2="758" y2="126" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="774" y1="112" x2="780" y2="126" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="750" y1="164" x2="750" y2="196" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arw)"/>
  <circle cx="830" cy="150" r="16" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <line x1="830" y1="150" x2="830" y2="139" stroke="#1f2937" stroke-width="2"/>
  <line x1="830" y1="150" x2="838" y2="155" stroke="#1f2937" stroke-width="2"/>
  <line x1="830" y1="134" x2="830" y2="128" stroke="#1f2937" stroke-width="3"/>
  <text x="712" y="220" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937">h = &#189; g t&#178;</text>

  <!-- ===== 5. Ruler (middle right) ===== -->
  <text x="700" y="262" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">5. Ruler</text>
  <rect x="700" y="270" width="180" height="140" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="736" y1="284" x2="736" y2="394" stroke="#1f2937" stroke-width="3"/>
  <line x1="712" y1="394" x2="870" y2="394" stroke="#1f2937" stroke-width="3"/>
  <use href="#barom" x="744" y="284"/>
  <use href="#barom" x="744" y="320"/>
  <use href="#barom" x="744" y="356"/>
  <line x1="770" y1="284" x2="778" y2="284" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="770" y1="320" x2="778" y2="320" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="770" y1="356" x2="778" y2="356" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="770" y1="392" x2="778" y2="392" stroke="#1f2937" stroke-width="1.5"/>
  <text x="790" y="346" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">n &#215; l</text>

  <!-- ===== 6. Trade (bottom right) ===== -->
  <text x="700" y="442" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">6. Trade</text>
  <rect x="700" y="450" width="180" height="140" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="712" y1="572" x2="870" y2="572" stroke="#1f2937" stroke-width="3"/>
  <rect x="716" y="500" width="52" height="72" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <circle cx="760" cy="538" r="3" fill="#1f2937"/>
  <circle cx="830" cy="506" r="11" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <line x1="830" y1="517" x2="830" y2="548" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="830" y1="548" x2="820" y2="572" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="830" y1="548" x2="842" y2="572" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="830" y1="526" x2="800" y2="532" stroke="#1f2937" stroke-width="2.5"/>
  <use href="#barom" x="786" y="522"/>
  <rect x="764" y="458" width="104" height="32" rx="8" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <path d="M 800 490 L 794 504 L 814 490 Z" fill="#f3f4f6" stroke="#1f2937" stroke-width="2"/>
  <text x="816" y="481" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#b91c1c">the height</text>

  <text x="450" y="606" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937">Only method 1 uses the barometer as a barometer.</text>
</svg>
