<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-labelledby="t d">
  <title id="t">Harmonic stack of five blocks</title>
  <desc id="d">Five identical blocks stacked at a table edge. Working down from the top, each block projects 1/2, 1/4, 1/6, 1/8 and 1/10 of a block length beyond the one below it (the bottom block beyond the table edge). The top block lies entirely beyond the edge; the total overhang is (1/2)(1 + 1/2 + 1/3 + 1/4 + 1/5) = 137/120 of a block length. The centre of mass of the whole stack lies exactly above the table edge.</desc>
  <rect x="0" y="0" width="840" height="500" fill="#ffffff"/>
  <g font-family="Montserrat, Helvetica, Arial, sans-serif" fill="#1f2937">
    <!-- table -->
    <rect x="20" y="330" width="350" height="70" fill="#e5e7eb" stroke="none"/>
    <line x1="20" y1="330" x2="370" y2="330" stroke="#1f2937" stroke-width="4"/>
    <text x="195" y="373" font-size="22" text-anchor="middle">table</text>
    <!-- table edge -->
    <text x="362" y="76" font-size="20" text-anchor="end">table edge</text>
    <!-- blocks, length 240, height 40; bottom to top -->
    <g fill="#f3f4f6" stroke="#1f2937" stroke-width="2.5">
      <rect x="154" y="290" width="240" height="40"/>
      <rect x="184" y="250" width="240" height="40"/>
      <rect x="224" y="210" width="240" height="40"/>
      <rect x="284" y="170" width="240" height="40"/>
      <rect x="404" y="130" width="240" height="40"/>
    </g>
    <line x1="370" y1="60" x2="370" y2="400" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 5"/>
    <!-- one block length -->
    <g stroke="#1f2937" stroke-width="2">
      <line x1="404" y1="110" x2="644" y2="110"/>
      <line x1="404" y1="102" x2="404" y2="118"/>
      <line x1="644" y1="102" x2="644" y2="118"/>
    </g>
    <text x="524" y="98" font-size="20" text-anchor="middle">1 block length</text>
    <!-- offsets, top to bottom: 1/2, 1/4, 1/6, 1/8, 1/10 -->
    <g stroke="#b91c1c" stroke-width="3">
      <line x1="524" y1="190" x2="644" y2="190"/>
      <line x1="524" y1="182" x2="524" y2="198"/>
      <line x1="644" y1="182" x2="644" y2="198"/>
      <line x1="464" y1="230" x2="524" y2="230"/>
      <line x1="464" y1="222" x2="464" y2="238"/>
      <line x1="524" y1="222" x2="524" y2="238"/>
      <line x1="424" y1="270" x2="464" y2="270"/>
      <line x1="424" y1="262" x2="424" y2="278"/>
      <line x1="464" y1="262" x2="464" y2="278"/>
      <line x1="394" y1="310" x2="424" y2="310"/>
      <line x1="394" y1="302" x2="394" y2="318"/>
      <line x1="424" y1="302" x2="424" y2="318"/>
      <line x1="370" y1="348" x2="394" y2="348"/>
      <line x1="370" y1="340" x2="370" y2="356"/>
      <line x1="394" y1="340" x2="394" y2="356"/>
    </g>
    <g fill="#b91c1c" font-size="22" font-weight="bold">
      <text x="654" y="198">1/2</text>
      <text x="534" y="238">1/4</text>
      <text x="474" y="278">1/6</text>
      <text x="434" y="318">1/8</text>
      <text x="404" y="356">1/10</text>
    </g>
    <!-- total overhang -->
    <g stroke="#b91c1c" stroke-width="3">
      <line x1="370" y1="390" x2="644" y2="390"/>
      <line x1="370" y1="380" x2="370" y2="400"/>
      <line x1="644" y1="380" x2="644" y2="400"/>
    </g>
    <text x="507" y="436" font-size="22" text-anchor="middle">overhang = (1/2)(1 + 1/2 + 1/3 + 1/4 + 1/5)</text>
    <text x="507" y="468" font-size="22" text-anchor="middle">= 137/120 of a block length</text>
    <!-- centre of mass of the whole stack, above the table edge -->
    <line x1="214" y1="230" x2="362" y2="230" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="370" cy="230" r="7" fill="#b91c1c"/>
    <text x="206" y="237" font-size="20" text-anchor="end">centre of mass</text>
  </g>
</svg>
