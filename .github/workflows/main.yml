name: Documentation

on:
  push:
    branches:
      - main
  # Validation (OKF conformance, llms.txt drift) and a trial build on every
  # PR, so problems surface before merge rather than after.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch or PR: a newer push supersedes an older run, but a pull
# request run never cancels a deployment from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every docs/ page must conform to the Open Knowledge Format (OKF v0.2);
  # the generated llms.txt indexes must match the committed ones.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: OKF v0.2 conformance
        run: python scripts/okf_validate.py docs
      - name: Problem index and nav drift
        run: |
          python scripts/gen_problem_index.py
          git diff --exit-code docs/problems/index.md mkdocs.yml
      - name: llms.txt drift
        run: |
          python scripts/gen_llms_txt.py
          git diff --exit-code docs/llms.txt docs/llms-full.txt

  # Full static build on PRs and on main. The llms indexes are regenerated
  # first so the deployed site is always current even if the drift check
  # above is ever relaxed.
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/gen_llms_txt.py
      - run: mkdocs build --clean --strict
      # Agent surface: per-page Markdown mirror, okf:* meta tags, robots.txt
      - run: python scripts/postbuild_agent_surface.py site
      # Post-build assertions: llms/robots/sitemap present, mirror complete
      - run: python scripts/check_site.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy only from pushes to main (never from PRs). configure-pages with
  # `enablement: true` switches the Pages source from the gh-pages branch to
  # GitHub Actions the first time it runs. If that first run fails on
  # permissions, set Settings > Pages > Source = "GitHub Actions" once in the
  # repository settings and re-run the workflow.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
