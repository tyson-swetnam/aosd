name: Documentation

# Same okf-conformance and deploy jobs as UNM-CARC/docs (and the same
# conformance test as idss-mesa.github.io): validate the OKF v0.2 bundle and
# the generated indexes, then build with Zensical, add the agent surface and
# deploy to GitHub Pages from main. Additions for this site are marked "aosd".
on:
  push:
    branches:
      - main
  # Validation (incl. the llms.txt drift check) and a trial build on PRs,
  # so problems surface before merge rather than after.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# aosd: one group per branch or PR, so a pull request run never cancels a
# deployment from main (UNM-CARC/docs uses a single "pages" group).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validate that every docs page conforms to the Open Knowledge Format (OKF v0.2)
  okf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pyyaml
      - run: python scripts/okf_validate.py docs
      # Fail if the llms.txt machine-readable indexes are out of date
      - run: |
          python scripts/gen_llms_txt.py
          git diff --exit-code docs/llms.txt docs/llms-full.txt
      # aosd: fail if the problem index or its nav block in mkdocs.yml is out of date
      - run: |
          python scripts/gen_problem_index.py
          git diff --exit-code docs/problems/index.md mkdocs.yml

  # aosd: trial build on pull requests (the deploy job below never runs on
  # them), with the same steps and the post-build assertions.
  build:
    needs: okf-conformance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical pyyaml
      - run: zensical build --clean --strict
      - run: python scripts/postbuild_agent_surface.py site
      - run: python scripts/check_site.py site

  deploy:
    needs: okf-conformance
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical pyyaml
      # aosd: --strict, so a broken link or anchor stops the deploy
      - run: zensical build --clean --strict
      # Agent surface: markdown mirror, OKF meta injection, robots.txt
      - run: python scripts/postbuild_agent_surface.py site
      # aosd: post-build assertions (mirror complete, no folded lists)
      - run: python scripts/check_site.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
